<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铁途学练 · 开通工具</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;background:#f5f3ee;margin:0;padding:16px;color:#221f1a;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:14px}
h1{font-size:17px;margin:0 0 4px;color:#b71c1c}
.sub{font-size:12.5px;color:#64748b;margin:0 0 14px;line-height:1.6}
h2{font-size:14px;margin:0 0 12px;color:#0d47a1}
label{display:block;font-size:12.5px;color:#64748b;margin:12px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #e2e8f0;border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
textarea{min-height:72px;resize:vertical}
button{border:0;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;padding:12px;width:100%}
.primary{background:#0d47a1;color:#fff}
.primary:disabled{background:#94a3b8;cursor:not-allowed}
.ghost{background:#f1f5f9;color:#475569}
.small{padding:8px 10px;font-size:12.5px;width:auto}
.log{margin-top:12px;padding:11px;border-radius:9px;font-size:12.5px;line-height:1.7;background:#f8fafc;border:1px solid #e2e8f0;white-space:pre-wrap;word-break:break-all;min-height:42px}
.log.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.log.err{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 4px;border-bottom:1px solid #f1f5f9;text-align:left;word-break:break-all}
td.dc{font-family:ui-monospace,Consolas,monospace;font-weight:600;color:#0d47a1}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;background:#e0f2fe;color:#0369a1;margin-left:4px}
.tag.warn{background:#fef3c7;color:#92400e}
.del{color:#b91c1c;background:none;border:0;font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
.hint{font-size:11.5px;color:#94a3b8;line-height:1.6;margin-top:8px}
.tiers{display:flex;gap:6px;flex-wrap:wrap}
.tier{padding:7px 11px;border:1px solid #e2e8f0;border-radius:8px;font-size:12.5px;background:#f8fafc;cursor:pointer}
.tier.on{border-color:#0d47a1;background:#eff6ff;color:#0d47a1;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>铁途学练 · 开通工具</h1>
    <p class="sub">给用户开通授权：填设备码 → 选时长 → 点开通。用户在自己手机上点「我已开通，立即刷新」就能用。</p>

    <h2>① 连接 GitHub（只需设置一次）</h2>
    <label>访问令牌（Personal Access Token，只保存在本机浏览器里）</label>
    <div class="row">
      <input id="token" type="password" placeholder="github_pat_... 或 ghp_...">
      <button class="ghost small" onclick="saveToken()">保存</button>
    </div>
    <div class="hint">仓库：Jjqgd / tietuxueliandingidgnban ｜ 文件：licenses.json ｜ 分支：main</div>
    <div class="log" id="log0">未连接</div>
  </div>

  <div class="card">
    <h2>② 给用户开通</h2>
    <label>设备码（用户发你的那串，可以一次填多个，每行一个）</label>
    <textarea id="devices" placeholder="例如 ABCDE-FGHJK-MNPQR&#10;多台设备直接换行"></textarea>
    <label>开通时长</label>
    <div class="tiers" id="tiers"></div>
    <label>备注（买家姓名 / 订单号，方便对账，可不填）</label>
    <input id="note" placeholder="如：张三 微信30元">
    <div style="margin-top:16px"><button class="primary" id="btnAdd" onclick="addDevices()">立即开通</button></div>
    <div class="log" id="log1">等待操作</div>
    <div class="hint">开通后让对方等 1～2 分钟（GitHub 缓存刷新），再点「我已开通，立即刷新」。续费直接把时长选长一点再开一次即可。</div>
  </div>

  <div class="card">
    <h2>③ 已开通的设备</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="ghost small" onclick="loadList(true)">刷新列表</button>
      <span style="font-size:12px;color:#64748b" id="count">—</span>
    </div>
    <div id="listBox">尚未读取</div>
  </div>
</div>

<script>
/* 一次性配置：打开 admin.html#tk=令牌 就自动存到本机，并把令牌从地址栏抹掉 */
(function () {
  try {
    var m = location.hash.match(/tk=([^&]+)/);
    if (m) {
      localStorage.setItem('tt_token', decodeURIComponent(m[1]));
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
  } catch (e) {}
})();
var OWNER = 'Jjqgd', REPO = 'tietuxueliandingidgnban', FILE = 'licenses.json', BRANCH = 'main';
var PERM = 4102444800000;
var TAGS = ['ABCDEFGHJKLMNPQRSTUVWXYZ23456789'];
var DAYS = 0;
var tiers = [
  ['7天', 7], ['15天', 15], ['30天', 30], ['90天', 90], ['180天', 180], ['365天', 365], ['永久', 0]
];

function tok() { return localStorage.getItem('tt_token') || ''; }
function saveToken() {
  var v = document.getElementById('token').value.trim();
  localStorage.setItem('tt_token', v);
  setLog('log0', v ? '已保存令牌（长度 ' + v.length + '）' : '已清空令牌', v ? 'ok' : '');
  loadList(true);
}
function setLog(id, msg, cls) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'log' + (cls ? ' ' + cls : '');
}
function normDevice(s) {
  var raw = String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (raw.length !== 15) return null;
  return raw.slice(0, 5) + '-' + raw.slice(5, 10) + '-' + raw.slice(10, 15);
}
function fmt(exp) {
  if (exp >= PERM) return '永久';
  var d = new Date(exp);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function b64encode(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64) {
  var bin = atob(b64.replace(/\n/g, ''));
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function ghHeaders() {
  var h = { 'Accept': 'application/vnd.github+json' };
  if (tok()) h['Authorization'] = 'Bearer ' + tok();
  return h;
}

async function ghGet() {
  var r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + FILE + '?ref=' + BRANCH + '&t=' + Date.now(), { headers: ghHeaders(), cache: 'no-store' });
  if (!r.ok) throw new Error('读取失败 HTTP ' + r.status + (r.status === 401 ? '（令牌无效或过期）' : r.status === 404 ? '（仓库或文件不存在）' : ''));
  var j = await r.json();
  var txt = b64decode(j.content);
  var data = JSON.parse(txt);
  if (!data.list) data.list = [];
  return { data: data, sha: j.sha };
}

async function ghPut(data, sha, msg) {
  if (!tok()) throw new Error('还没设置令牌，先在上面填好并保存');
  data.updated = new Date().toISOString().slice(0, 10);
  var body = {
    message: msg || '更新授权白名单',
    content: b64encode(JSON.stringify(data, null, 2)),
    sha: sha ? sha : undefined,
    branch: BRANCH
  };
  var r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + FILE, {
    method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders()), body: JSON.stringify(body)
  });
  if (!r.ok) {
    var t = await r.text();
    throw new Error('写入失败 HTTP ' + r.status + ' ' + t.slice(0, 200));
  }
  return await r.json();
}

async function loadList(showLog) {
  var box = document.getElementById('listBox');
  try {
    var g = await ghGet();
    renderList(g.data.list);
    document.getElementById('count').textContent = '共 ' + g.data.list.length + ' 台设备 · 线上版本 ' + (g.data.updated || '—');
    if (showLog) setLog('log0', '已连接：' + OWNER + '/' + REPO + '，当前 ' + g.data.list.length + ' 条授权', 'ok');
    return g;
  } catch (e) {
    box.innerHTML = '<span style="color:#b91c1c;font-size:12.5px">' + e.message + '</span>';
    if (showLog) setLog('log0', e.message, 'err');
    return null;
  }
}

function renderList(list) {
  var box = document.getElementById('listBox');
  if (!list.length) { box.innerHTML = '<span style="color:#94a3b8;font-size:12.5px">还没有开通任何设备</span>'; return; }
  var rows = list.slice().sort(function (a, b) { return (b.exp || 0) - (a.exp || 0); }).map(function (it) {
    var expired = (it.exp || 0) <= Date.now();
    return '<tr><td class="dc">' + (it.d || '') + '</td>' +
      '<td>' + fmt(it.exp || 0) + (expired ? '<span class="tag warn">已到期</span>' : '') + '</td>' +
      '<td>' + (it.note || '') + '</td>' +
      '<td><button class="del" onclick="removeDevice(\'' + (it.d || '') + '\')">删除</button></td></tr>';
  }).join('');
  box.innerHTML = '<table><tr><th>设备码</th><th>到期</th><th>备注</th><th></th></tr>' + rows + '</table>';
}

async function addDevices() {
  var btn = document.getElementById('btnAdd');
  var raw = document.getElementById('devices').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  if (!raw.length) { setLog('log1', '请先填设备码', 'err'); return; }
  var devs = [], bad = [];
  raw.forEach(function (s) { var n = normDevice(s); if (n) devs.push(n); else bad.push(s); });
  if (!devs.length) { setLog('log1', '设备码格式不对（应为 15 位字母数字，形如 ABCDE-FGHJK-MNPQR）', 'err'); return; }

  btn.disabled = true;
  setLog('log1', '正在写入线上…');
  try {
    var g = await ghGet();
    var list = g.data.list;
    var exp = DAYS <= 0 ? PERM : Date.now() + DAYS * 86400000;
    var note = document.getElementById('note').value.trim();
    devs.forEach(function (d) {
      var found = null;
      for (var i = 0; i < list.length; i++) if (normDevice(list[i].d) === d) { found = list[i]; break; }
      if (found) { if (found.exp < exp) found.exp = exp; if (note) found.note = note; }
      else list.push({ d: d, exp: exp, note: note });
    });
    await ghPut(g.data, g.sha, '开通授权：' + devs.length + ' 台设备');
    var lines = ['✅ 已开通 ' + devs.length + ' 台设备，到期：' + fmt(exp)];
    if (bad.length) lines.push('⚠ 格式不对已跳过：' + bad.join('、'));
    lines.push('让对方等 1～2 分钟后点「我已开通，立即刷新」。');
    setLog('log1', lines.join('\n'), 'ok');
    document.getElementById('devices').value = '';
    await loadList(false);
  } catch (e) {
    setLog('log1', '❌ ' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

async function removeDevice(d) {
  if (!confirm('确定删除 ' + d + ' 的授权？删除后对方下次联网会被锁。')) return;
  setLog('log1', '正在删除…');
  try {
    var g = await ghGet();
    g.data.list = g.data.list.filter(function (it) { return normDevice(it.d) !== normDevice(d); });
    await ghPut(g.data, g.sha, '删除授权：' + d);
    setLog('log1', '✅ 已删除 ' + d, 'ok');
    await loadList(false);
  } catch (e) {
    setLog('log1', '❌ ' + e.message, 'err');
  }
}

(function init() {
  document.getElementById('token').value = tok();
  var box = document.getElementById('tiers');
  tiers.forEach(function (t, i) {
    var el = document.createElement('div');
    el.className = 'tier' + (i === 2 ? ' on' : '');
    el.textContent = t[0];
    el.onclick = function () {
      DAYS = t[1];
      Array.prototype.forEach.call(box.children, function (c) { c.classList.remove('on'); });
      el.classList.add('on');
    };
    box.appendChild(el);
  });
  DAYS = 30;
  if (tok()) loadList(true); else loadList(false);
})();
</script>
</body>
</html>
